<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STUREKA RISA — Study Research</title>
<meta name="description" content="STUREKA RISA: website pengelolaan dan pemantauan penelitian. Tanpa login, tanpa server.">
<link rel="icon" href="images/assets/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#1d4ed8">

<!-- Terapkan tema sebelum render agar tidak berkedip -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('sturekarisa.theme');
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="libraries/quill/quill.snow.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
    <a class="brand" href="#/dashboard">
      <img src="images/assets/logo.svg" alt="" width="44" height="44">
      <strong>STUREKA RISA</strong>
      <span>Study Research</span>
    </a>

    <nav class="nav">
      <a class="nav-item" href="#/dashboard" data-nav="dashboard"><i data-ic="layout-dashboard"></i><span>Dashboard</span></a>
      <a class="nav-item" href="#/penelitian" data-nav="penelitian"><i data-ic="folder-kanban"></i><span>Semua Penelitian</span></a>
      <button class="nav-item" type="button" data-act="add-research"><i data-ic="plus"></i><span>Tambah Penelitian</span></button>
      <div class="nav-sep"></div>
      <a class="nav-item" href="#/pengaturan" data-nav="pengaturan"><i data-ic="settings"></i><span>Pengaturan</span></a>
      <a class="nav-item" href="#/tentang" data-nav="tentang"><i data-ic="info"></i><span>Tentang</span></a>
    </nav>

    <div class="sidebar-foot">
      <p class="quote" id="sideQuote"></p>
    </div>
  </aside>
  <div class="scrim" id="scrim" data-act="close-sidebar"></div>

  <!-- ================= KONTEN ================= -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" type="button" data-act="open-sidebar" aria-label="Buka menu"><i data-ic="menu"></i></button>
      <img class="only-mobile top-logo" src="images/assets/logo.svg" alt="STUREKA RISA" width="30" height="30">

      <label class="search" for="topSearch">
        <i data-ic="search"></i>
        <input id="topSearch" type="search" placeholder="Cari penelitian… (Ctrl + K)" autocomplete="off">
      </label>

      <div class="top-actions">
        <button class="icon-btn" type="button" data-act="toggle-theme" aria-label="Ganti mode terang atau gelap" title="Ganti mode terang / gelap" id="themeTop"></button>
        <div class="pop-wrap">
          <button class="icon-btn" type="button" data-act="bell" aria-label="Pengingat deadline" id="bellBtn"><i data-ic="bell"></i><span class="dot" id="bellDot" hidden></span></button>
          <div class="popover bell-pop" id="bellPop" hidden></div>
        </div>
        <a class="avatar" href="#/pengaturan" id="avatar" aria-label="Pengaturan profil">S</a>
      </div>
    </header>

    <main class="content" id="content" tabindex="-1">
      <section class="banner-wrap" id="bannerWrap" hidden>
        <img id="bannerImg" class="banner" alt="">
      </section>
      <div id="app"></div>
    </main>
  </div>
</div>

<!-- Modal & toast dibuat oleh script.js -->
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="attachFile" multiple hidden>

<noscript><p style="padding:24px">STUREKA RISA membutuhkan JavaScript untuk berjalan.</p></noscript>

<script src="libraries/icons.js"></script>
<script src="libraries/quill/quill.min.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
